<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Framecraft — AI Video Production Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">FC</span>
    <span class="brand-name">Framecraft <em>studio</em></span>
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab on" data-tab="studio">Studio</button>
    <button class="tab" data-tab="learn">Learn</button>
    <button class="tab" data-tab="knowledge">Knowledge</button>
    <button class="tab" data-tab="settings">Settings</button>
  </nav>

  <div class="top-actions">
    <div class="seg" id="mode-pill" title="Demo works offline. Live unlocks once API keys are set in Settings.">
      <button data-mode="demo" class="on">Demo</button>
      <button data-mode="live">Live</button>
    </div>
    <button class="iconbtn" id="theme-btn" title="Toggle light / dark">
      <svg class="ic-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="ic-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <section id="view-studio"></section>
  <section id="view-learn" hidden></section>
  <section id="view-knowledge" hidden></section>
  <section id="view-settings" hidden></section>
</main>

<div id="busy" hidden>
  <div class="busy-card">
    <div class="spinner"></div>
    <div id="busy-label">Working…</div>
  </div>
</div>

<div id="toasts"></div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
